name: Debug YouTube access

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Write cookies
        run: |
          printf '%s\n' "$YT_COOKIES" > cookies.txt
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}

      - name: Test akses stream (4 metode)
        env:
          CONTENTFORGE_COOKIES: "cookies.txt"
          CONTENTFORGE_JS_RUNTIME: "node"
        run: python .github/debug_yt.py

      - name: Upload debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug_out/
          if-no-files-found: ignore
          retention-days: 3
